<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VERUS Content Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#081013">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky brand bar + text tabs, then one working surface per section. Single dark VERUS look. */
:root{
  color-scheme:dark;
  --bg:#081013; --bg-glow:#0f2a27; --panel:#0f1a1d; --panel2:#132226; --field:#0b1417;
  --ink:#f1f6f4; --ink2:#a7b7b2; --ink3:#6c7f7a;
  --line:rgba(190,240,225,.08); --line2:rgba(190,240,225,.15);
  --mint:#5fd1a7; --mint2:#3f9e8c; --mintInk:#04130e; --mintSoft:rgba(95,209,167,.12);
  --accent:var(--mint); --accentInk:var(--mintInk);
  --danger:#ff7a6b; --ok:#5fd1a7; --warn:#f0b85a;
  --radius:18px; --shadow:0 10px 40px rgba(0,0,0,.35);
  --head:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 520px at 70% -120px,var(--bg-glow),transparent 70%),var(--bg);background-attachment:fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--mint)}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:30px;line-height:1.1} h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
h4{margin:0 0 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--mint)}
.muted{color:var(--ink2)} .tiny{font-size:12px;color:var(--ink3)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- top bar ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,16,19,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar,nav.tabs,.demo-banner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:14px;white-space:nowrap}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-size:17px;font-weight:800;letter-spacing:.16em}
.brand .wm i{font-style:normal;font-size:11.5px;font-weight:500;letter-spacing:.24em;color:var(--ink2);margin-top:3px}
.brand .div{width:1px;height:30px;background:var(--line2)}
.brand .lbl{font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--mint)}
.bar .sp{flex:1;min-width:0}
@media (max-width:480px){.brand .div,.brand .lbl{display:none}}
.userchip{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--mintSoft);color:var(--mint);border:1px solid rgba(95,209,167,.35);font-weight:800;font-size:11.5px;flex:none;letter-spacing:.04em}
nav.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding-block:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:10px 16px 12px;font-weight:600;font-size:14.5px;color:var(--ink2);cursor:pointer;white-space:nowrap;position:relative}
nav.tabs button+button::before{content:"";position:absolute;left:0;top:12px;bottom:14px;width:1px;background:var(--line2)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--mint)}
nav.tabs button.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:var(--mint);box-shadow:0 0 12px var(--mint)}
.badge{display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:18px;border-radius:9px;background:var(--warn);color:#241600;font-size:11px;font-weight:800;text-align:center;margin-left:6px}
.demo-banner{background:var(--mintSoft);color:var(--ink2);font-size:12.5px;padding-block:7px;border-bottom:1px solid var(--line)}
.demo-banner b{color:var(--mint)}
main{max-width:1400px;margin:0 auto;padding-block:22px calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ---------- generic ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.vhead h2{margin-right:auto}
.card{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:9px 15px;border-radius:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink);transition:border-color .15s,background .15s}
.btn:hover{border-color:rgba(95,209,167,.45)}
.btn.primary{background:linear-gradient(135deg,#63d3a8,#3f9e8c);color:#fff;border-color:transparent;box-shadow:0 0 22px rgba(95,209,167,.22);text-shadow:0 1px 1px rgba(0,0,0,.15)}
.btn.primary:hover{box-shadow:0 0 28px rgba(95,209,167,.35)}
.btn.danger{color:var(--danger);border-color:rgba(255,122,107,.35);background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mint)}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:5px 7px;border-radius:8px;color:var(--ink3);font-size:14px;line-height:1}
.icon-btn:hover{background:var(--panel2);color:var(--ink)}
.icon-btn[disabled]{opacity:.3;cursor:default}
[hidden]{display:none!important}
input[type=text],input[type=email],input[type=url],input[type=search],input[type=tel],input[type=password],input[type=date],input[type=number],input:not([type]),select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--field);min-height:40px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(95,209,167,.6);box-shadow:0 0 0 3px rgba(95,209,167,.12)}
input[type=checkbox]{accent-color:var(--mint)}
label.f{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin:0 0 6px;text-transform:uppercase;letter-spacing:.14em}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.04);border:1px solid var(--line2);white-space:nowrap;color:var(--ink2)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.pill-sel{display:flex;gap:6px;flex-wrap:wrap}
.pill-sel label{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;user-select:none;color:var(--ink2)}
.pill-sel input{display:none}
.pill-sel label.on{background:var(--mintSoft);color:var(--mint);border-color:rgba(95,209,167,.55)}
.empty{padding:30px;text-align:center;color:var(--ink3)}
/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:980px){.cal-wrap{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.cal{overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:4px 0 8px}
.cal-dow div{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--ink3)}
.cal-week{border-radius:14px;padding:3px;margin-bottom:4px}
.cal-week.sel{background:var(--mintSoft)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{position:relative;min-height:108px;border:1px solid var(--line);border-radius:12px;cursor:pointer;overflow:hidden;background:var(--field);transition:border-color .15s}
.day:hover{border-color:rgba(95,209,167,.4)}
.day.out{opacity:.45}
.dnum{position:absolute;top:6px;left:7px;z-index:2;font-size:13px;font-weight:800;color:var(--ink2);padding:0 6px;border-radius:7px;line-height:22px}
.day .bands ~ .dnum, .day:has(.bands) .dnum{background:rgba(0,0,0,.32);color:#fff}
.day.today .dnum{background:var(--mint);color:var(--mintInk)}
.day.selday{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 18px rgba(95,209,167,.18)}
.bands{position:absolute;inset:0;display:flex;flex-direction:column}
.band{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:space-between;gap:4px;padding:3px 7px 5px;font-size:11.5px;font-weight:700;line-height:1.2;border-top:1px solid rgba(0,0,0,.25);overflow:hidden}
.band:first-child{border-top:0;padding-top:30px}
.band .bt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.band .bs{flex:none;font-size:11px}
.band.s-tofilm{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 6px,transparent 6px 12px)}
.band.s-edited{background-image:radial-gradient(rgba(255,255,255,.3) 1.2px,transparent 1.4px);background-size:7px 7px}
.band:hover{filter:brightness(1.08)}
.mix{display:flex;height:4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.05);margin:5px 4px 1px}
.mix div{height:100%}
@media (max-width:640px){
  .cal{padding:6px}
  .cal-days,.cal-dow{gap:3px}
  .day{min-height:64px;border-radius:9px}
  .band .bt{display:none}
  .band{justify-content:flex-end;padding:2px 3px}
  .band:first-child{padding-top:24px}
  .dnum{font-size:11.5px;top:3px;left:3px;padding:0 4px;line-height:18px}
  .cal-dow div{letter-spacing:.06em;font-size:10px}
}
.side h3{font-weight:800}
.side .wk-mix{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.side-day{margin-top:14px}
.side-day .dh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--ink3);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.side-day.hl .dh{color:var(--mint)}
.sitem{display:flex;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:7px;cursor:pointer;background:var(--field)}
.sitem:hover{border-color:rgba(95,209,167,.4)}
.sitem .sw{width:4px;border-radius:3px;flex:none}
.sitem .st{font-weight:700;font-size:14px;line-height:1.3}
.sitem .sm{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* ---------- ideas ---------- */
.ideas-cols{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.ideas-cols{grid-template-columns:1fr}}
.fcol{border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);overflow:hidden}
.fcol-h{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);color:var(--ink)!important;background:var(--panel2)!important;position:relative}
.fcol-h::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--fc)}
.fcol-h h3{font-size:19px;flex:1;font-weight:800}
.fcol-h .cnt{font-weight:800;font-size:12px;background:rgba(255,255,255,.06);padding:2px 9px;border-radius:999px;color:var(--ink2)}
.fcol-h .icon-btn{color:var(--mint)!important;font-size:18px}
.fcol-b{padding:12px}
.tgroup{margin-bottom:14px}
.tgroup .tg-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--mint);margin:4px 2px 8px;display:flex;justify-content:space-between}
.tgroup .tg-h span:last-child{color:var(--ink3)}
.icard{background:var(--field);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;overflow:hidden;display:flex}
.icard:hover{border-color:rgba(95,209,167,.4)}
.icard .ib{padding:11px 13px;min-width:0;flex:1}
.icard .it{font-weight:700;line-height:1.3}
.icard .id{font-size:12.5px;color:var(--ink2);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.icard .im{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.icard img{width:68px;object-fit:cover;flex:none;background:var(--panel2)}
.icard.done{opacity:.55}
/* ---------- library ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media (max-width:480px){.lib-grid{grid-template-columns:1fr 1fr;gap:10px}}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.lcard:hover{border-color:rgba(95,209,167,.4)}
.lthumb{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--panel2);overflow:hidden}
.lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lthumb .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.lthumb .fbadge{position:absolute;left:9px;top:9px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.lthumb .ready{position:absolute;right:9px;top:9px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--warn);color:#241600}
.lbody{padding:11px 13px 13px}
.lbody .lt{font-weight:700;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lbody .lm{font-size:12px;color:var(--ink2);margin-top:5px}
.lbody .lm b{color:var(--mint)}
.lbody .lc{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
/* ---------- review ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .kl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--mint)}
.kpi .kv{font-family:var(--head);font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink3);padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover,.tbl th.sorted{color:var(--mint)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.ttl{white-space:normal;min-width:200px;font-weight:700}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:rgba(95,209,167,.05)}
.na{color:var(--ink3)}
.due{border-color:rgba(240,184,90,.4);background:linear-gradient(90deg,rgba(240,184,90,.08),transparent 60%),var(--panel)}
.due b{color:var(--warn)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters>*{width:auto;min-width:130px;flex:1 1 130px;max-width:240px}
.filters label.chk{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;flex:0 0 auto;min-width:0;color:var(--ink2)}
/* ---------- weekly / plan / reflections ---------- */
.wk-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.wk-grid{grid-template-columns:1fr}}
.q{font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.q b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--mintSoft);border:1px solid rgba(95,209,167,.4);color:var(--mint);font-size:12.5px;flex:none}
.wk-item{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wk-item:last-child{border-bottom:0}
.wk-item .sw{width:4px;align-self:stretch;border-radius:3px;flex:none}
.plan-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.plan-cols{grid-template-columns:1fr}}
.plan-cols h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--mint)}
.pnote{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pnote.done .ptext{text-decoration:line-through;color:var(--ink3)}
.pnote .ptext{white-space:pre-wrap;word-break:break-word}
.pnote .pmeta{display:flex;align-items:center;gap:2px;margin-top:8px;font-size:11.5px;color:var(--ink3)}
.pnote .pmeta .sp{flex:1}
.check-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.check-item:last-of-type{border-bottom:0}
.check-item input[type=checkbox]{width:18px;height:18px;flex:none}
.check-item .ct{flex:1;min-width:0}
.check-item.done .ct{color:var(--ink3);text-decoration:line-through}
.refl{display:flex;gap:13px;padding:16px;margin-bottom:10px}
.refl .rb{flex:1;min-width:0}
.refl .rh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.refl .rh b{font-size:14px}
.refl .rt{white-space:pre-wrap;word-break:break-word;margin-top:6px;color:var(--ink)}
/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.set-grid{grid-template-columns:1fr}}
.fedit{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:var(--field)}
.fedit .fh{display:flex;gap:8px;align-items:center}
.fedit input[type=color]{width:42px;height:40px;padding:3px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);flex:none;cursor:pointer}
.trow{display:flex;gap:6px;align-items:center;margin-top:7px}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(2,6,7,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 12px}
.modal{width:100%;max-width:700px;background:var(--panel);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px var(--line2)}
.modal.sm{max-width:430px}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h3{flex:1;font-size:22px;font-weight:800}
.mb{padding:18px}
.mf{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel);border-radius:0 0 22px 22px}
.mf .sp{flex:1}

// ---------- constants ----------
const PLATFORMS = [
  {id:'ig',  name:'Instagram',      short:'IG',     metrics:['views','comments','shares','saves','follows','avgWatch']},

// ---------- image compression ----------
function compressImage(file, max, quality) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      let q = quality, out = c.toDataURL('image/jpeg', q);
      while (out.length > 850000 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image')); };
    img.src = url;
  });
}

const COLLS = ['posts','ideas','plans','reflections','comments','weekly','followers','weeklyword','youtube'];

const idb = {
  _db:null, mem:new Map(),
  open(){ return this._db ??= new Promise((res,rej)=>{ try{ const r = indexedDB.open('verus_hub_demo_img',1); r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res,rej)=>{ const t = db.transaction('img',mode); const r = fn(t.objectStore('img')); t.oncomplete=()=>res(r?.result); t.onerror=()=>rej(t.error); }); },
  async get(k){ try{ return await this.tx('readonly',s=>s.get(k)) ?? null; }catch{ return this.mem.get(k) ?? null; } },
  async put(k,v){ try{ await this.tx('readwrite',s=>s.put(v,k)); }catch{ this.mem.set(k,v); } },
  async del(k){ try{ await this.tx('readwrite',s=>s.delete(k)); }catch{ this.mem.delete(k); } },
};

class LocalStore {
  constructor(){
    this.mode = 'demo'; this.key = 'verus_hub_v2'; let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key)); } catch {}
    this.d = d || {settings:null}; COLLS.forEach(c => this.d[c] ??= {});
    this.subs = {};
  }
  persist(){ try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch { toast('Browser storage is full or blocked: demo changes may not be kept','err'); } }
  snapshot(c){ return c==='settings' ? this.d.settings : Object.entries(this.d[c]).map(([id,v])=>({id,...v})); }
  emit(c){ (this.subs[c]||[]).forEach(cb => cb(this.snapshot(c), {fromCache:false})); }
  subscribe(c, cb){ (this.subs[c] ??= []).push(cb); setTimeout(()=>cb(this.snapshot(c),{fromCache:false}),0); }
  async add(c,o){ const id = uid(); this.d[c][id] = clean(o); this.persist(); this.emit(c); return id; }
  async set(c,id,o){ this.d[c][id] = clean(o); this.persist(); this.emit(c); }
  async update(c,id,p){ if(!this.d[c][id]) return; this.d[c][id] = {...this.d[c][id], ...clean(p)}; this.persist(); this.emit(c); }
  async remove(c,id){ delete this.d[c][id]; this.persist(); this.emit(c); }
  async setSettings(s){ this.d.settings = clean(s); this.persist(); this.emit('settings'); }
  async putImage(id,data){ await idb.put(id,data); }
  async getImage(id){ return idb.get(id); }
  async deleteImage(id){ await idb.del(id); }
  reset(){ try{ localStorage.removeItem(this.key); indexedDB.deleteDatabase('verus_hub_demo_img'); }catch{} location.reload(); }
}

class FirebaseStore {
  constructor(fb){ this.mode='firebase'; this.fb = fb; }
  subscribe(c, cb){
    const {fs, db} = this.fb;
    const onErr = e => { console.error(e); if (e.code==='permission-denied') showDenied(); else toast('Sync error: '+e.message,'err'); };
    if (c==='settings') return fs.onSnapshot(fs.doc(db,'settings','main'), {includeMetadataChanges:false}, s => cb(s.exists()? s.data() : null, s.metadata), onErr);
    return fs.onSnapshot(fs.collection(db,c), s => cb(s.docs.map(d=>({id:d.id,...d.data()})), s.metadata), onErr);
  }
  async add(c,o){ const id = uid(); await this.fb.fs.setDoc(this.fb.fs.doc(this.fb.db,c,id), clean(o)); return id; }
  async set(c,id,o){ await this.fb.fs.setDoc(this.fb.fs.doc(this.fb.db,c,id), clean(o)); }
  async update(c,id,p){ await this.fb.fs.updateDoc(this.fb.fs.doc(this.fb.db,c,id), clean(p)); }
  async remove(c,id){ await this.fb.fs.deleteDoc(this.fb.fs.doc(this.fb.db,c,id)); }
  async setSettings(s){ await this.fb.fs.setDoc(this.fb.fs.doc(this.fb.db,'settings','main'), clean(s)); }
  async putImage(id,data){ await this.fb.fs.setDoc(this.fb.fs.doc(this.fb.db,'images',id), {data, t:Date.now()}); }
  async getImage(id){ const s = await this.fb.fs.getDoc(this.fb.fs.doc(this.fb.db,'images',id)); return s.exists() ? s.data().data : null; }
  async deleteImage(id){ try { await this.fb.fs.deleteDoc(this.fb.fs.doc(this.fb.db,'images',id)); } catch {} }
}

function hydrate(root=document){
  $$('img[data-img]', root).forEach(async el => {
    if (el.dataset.loaded === el.dataset.img) return; el.dataset.loaded = el.dataset.img;
    const src = await getImg(el.dataset.img); if (src && el.dataset.img === el.dataset.loaded) el.src = src; else if (!src) el.style.visibility='hidden';
  });
}
async function uploadImage(file){

  imgCache.set(id, Promise.resolve(full)); imgCache.set(id+'_t', Promise.resolve(thumb));
  return id;
}

function requestRender(){

    refreshThreads();
    const a = document.activeElement, view = $('#view');
    if (view && a && view.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { deferred = true; return; }
    renderShell(); renderView();
  });
}
document.addEventListener('focusout', e => { if (deferred && $('#view')?.contains(e.target)) { deferred = false; setTimeout(requestRender, 60); } });

// CALENDAR

const fmtTime = t => { if (!t) return ''; const [h,m] = t.split(':').map(Number); const ap = h>=12?'pm':'am'; const hh = h%12||12; return m ? `${hh}:${String(m).padStart(2,'0')}${ap}` : `${hh}${ap}`; };
const byTime = (a,b) => (a.time||'99:99').localeCompare(b.time||'99:99') || byCreated(a,b);
function postsOn(ds){ return S.posts.filter(p=>p.date===ds && p.source!=='manual').sort(byTime); }
function mixCounts(from, days=7){
  const counts = {}; for (let i=0;i<days;i++){ postsOn(iso(addDays(from,i))).forEach(p=>{ counts[p.funnelId] = (counts[p.funnelId]||0)+1; }); }
  return counts;
}
function mixBar(counts){
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  if (!total) return `<div class="mix"></div>`;
  const order = [...S.settings.funnels.map(f=>f.id), ...Object.keys(counts).filter(k=>!S.settings.funnels.some(f=>f.id===k))];
  return `<div class="mix" title="Funnel mix">${order.filter(k=>counts[k]).map(k=>`<div style="flex:${counts[k]};background:${esc(funnelOf(k).color)}"></div>`).join('')}</div>`;
}
function mixChips(counts){
  const order = S.settings.funnels.map(f=>f.id).concat(Object.keys(counts).filter(k=>!S.settings.funnels.some(f=>f.id===k)));
  const items = order.filter(k=>counts[k]).map(k=>`<span class="chip"><span class="dot" style="background:${esc(funnelOf(k).color)}"></span>${esc(funnelOf(k).name)}: ${counts[k]}</span>`);
  return items.length ? items.join('') : `<span class="tiny">Nothing planned yet</span>`;
}
function viewCalendar(){
  const m = S.cal.month, first = mondayOf(m), today = todayISO();
  const selMon = iso(mondayOf(parseISO(S.cal.sel)));
  let weeks = '', cur = new Date(first);
  do {
    const wkIso = iso(cur); let days = '';
    for (let i=0;i<7;i++){
      const d = addDays(cur,i), ds = iso(d), posts = postsOn(ds);
      const cls = ['day', d.getMonth()!==m.getMonth()?'out':'', ds===today?'today':'', ds===S.cal.sel?'selday':''].join(' ');
      days += `<div class="${cls}" data-act="day" data-date="${ds}" data-n="${posts.length}">
        <span class="dnum">${d.getDate()}</span>
        ${posts.length ? `<div class="bands">${posts.map(p=>{ const f = funnelOf(p.funnelId); return `<div class="band ${STATUS_CLS[p.status]||''}" style="background-color:${esc(f.color)};color:${textOn(f.color)}" data-act="openPost" data-id="${p.id}" title="${esc(p.title)} — ${esc(p.status)}"><span class="bt">${p.repostOf?'↻ ':''}${esc(p.title)}</span><span class="bs">${STATUS_ICON[p.status]||''}</span></div>`; }).join('')}</div>` : ''}
      </div>`;
    }
    weeks += `<div class="cal-week ${wkIso===selMon?'sel':''}"><div class="cal-days">${days}</div>${mixBar(mixCounts(cur))}</div>`;
    cur = addDays(cur,7);
  } while (cur.getMonth() === m.getMonth() && cur <= new Date(m.getFullYear(), m.getMonth()+1, 0));

  return `
  <div class="vhead">
    <h2>${m.toLocaleDateString('en-IE',{month:'long',year:'numeric'})}</h2>
    <button class="btn sm" data-act="calPrev" aria-label="Previous month">‹</button>
    <button class="btn sm" data-act="calToday">Today</button>
    <button class="btn sm" data-act="calNext" aria-label="Next month">›</button>
    <span class="btn sm upload-btn">Import schedule<input type="file" data-chg="importVideos"></span>
    <button class="btn primary" data-act="newPost" data-date="${S.cal.sel}">+ Post</button>
  </div>
  <div class="cal-wrap">
    ${sec('cal-month', `<h3>Month</h3><span class="cnt">${S.posts.filter(p=>p.date && p.source!=='manual' && parseISO(p.date).getMonth()===m.getMonth() && parseISO(p.date).getFullYear()===m.getFullYear()).length} posts</span>`, `
      <div class="legend">${S.settings.funnels.map(f=>`<span><i style="background:${esc(f.color)}"></i>${esc(f.name)}</span>`).join('')}
        <span class="tiny" style="font-weight:500">🎬 To film · ✂️ Edited · ⏰ Scheduled · ✅ Posted</span></div>
      <div class="cal">
        <div class="cal-dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')}</div>
        ${weeks}
      </div>`)}
    ${calSidebar()}
  </div>`;
}
function calSidebar(){
  const mon = mondayOf(parseISO(S.cal.sel));
  const sun = addDays(mon,6);
  let body = '';
  for (let i=0;i<7;i++){
    const ds = iso(addDays(mon,i)), posts = postsOn(ds);
    body += `<div class="side-day ${ds===S.cal.sel?'hl':''}">
      <div class="dh"><span>${fmtDay(ds)}</span><button class="icon-btn" data-act="newPost" data-date="${ds}" title="Add post on ${fmtDay(ds)}">＋</button></div>
      ${posts.map(p=>{ const f = funnelOf(p.funnelId); return `<div class="sitem" data-act="openPost" data-id="${p.id}">
        <div class="sw" style="background:${esc(f.color)}"></div>
        <div style="min-width:0"><div class="st">${p.repostOf?'↻ ':''}${esc(p.title)}</div>
        <div class="sm"><span>${p.time?`<b class="tm">${fmtTime(p.time)}</b> · `:''}${esc(funnelLabel(p.funnelId,p.typeId))}</span></div>
        <div class="sm"><span>${STATUS_ICON[p.status]||''} ${esc(p.status)}</span>${platChips(p.platforms)}</div></div></div>`; }).join('') || `<div class="tiny" style="padding:0 2px 4px">—</div>`}
    </div>`;
  }
  return sec('cal-week', `<h3>Week of ${mon.toLocaleDateString('en-IE',{day:'numeric',month:'short'})} – ${sun.toLocaleDateString('en-IE',{day:'numeric',month:'short'})}</h3>`, `
    <div class="wk-mix">${mixChips(mixCounts(mon))}</div>
    <div class="row" style="gap:6px"><button class="btn sm" data-act="wkPrev">‹ Prev week</button><button class="btn sm" data-act="wkNext">Next week ›</button><button class="btn sm ghost" data-act="toWeekly" data-wk="${iso(mon)}">Weekly review →</button></div>
    ${body}`, {cls:'side'});
}

function typeOptions(fid, sel){ const f = funnelOf(fid); return `<option value="">— No type —</option>` + f.types.map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)}</option>`).join(''); }
function funnelOptions(sel){ return S.settings.funnels.map(f=>`<option value="${f.id}" ${f.id===sel?'selected':''}>${esc(f.name)}</option>`).join(''); }

function openPostEditor(post={}, opts={}){
  const isNew = !post.id;
  const p = clean({ title:'', date: isNew && post.source!=='manual' ? todayISO() : '', funnelId: S.settings.funnels[0]?.id || '', typeId:'', status: post.source==='manual' ? 'Posted' : 'To film',

  const html = `

    <div class="field"><label class="f" for="pe-title">Full title</label><input id="pe-title" value="${esc(p.title)}" placeholder="e.g. Myth: carbs at night make you fat"></div>
    <div class="grid2">
      <div class="field"><label class="f" for="pe-date">${manual?'First posted (optional)':'Posting date'}</label><div class="row" style="flex-wrap:nowrap;gap:6px"><input id="pe-date" type="date" value="${esc(p.date)}">${manual?'':`<input id="pe-time" type="time" value="${esc(p.time||'')}" aria-label="Posting time" style="max-width:120px">`}</div><div class="tiny" id="pe-date-wk"></div></div>
      <div class="field"><label class="f">Status</label><select id="pe-status" ${manual?'disabled':''}>${STATUSES.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="f">Funnel</label><select id="pe-funnel">${funnelOptions(p.funnelId)}</select></div>
      <div class="field"><label class="f">Content type</label><select id="pe-type">${typeOptions(p.funnelId,p.typeId)}</select></div>
    </div>
    <div class="field"><label class="f" for="pe-link">Link to the post</label><input id="pe-link" type="url" inputmode="url" value="${esc(p.link||'')}" placeholder="https://www.instagram.com/reel/…"></div>
    <div class="field"><label class="f">Platforms</label><div class="pill-sel" id="pe-plats">${PLATFORMS.map(pl=>`<label class="${p.platforms.includes(pl.id)?'on':''}"><input type="checkbox" value="${pl.id}" ${p.platforms.includes(pl.id)?'checked':''}>${pl.name}</label>`).join('')}</div></div>
    <div class="field"><label class="f">Notes / caption / why we're posting it</label><textarea id="pe-notes" rows="3">${esc(p.notes)}</textarea></div>
    <div class="grid2">
      <div class="field"><label class="f">Thumbnail <span id="pe-treq" class="tiny"></span></label><div id="pe-thumb"></div></div>
      <div class="field"><label class="f">Screenshot of the post <span id="pe-req" class="tiny"></span></label><div id="pe-shot"></div></div>
    </div>
    <div class="grid2" id="pe-recycle-wrap">
      <div class="field"><label class="f" for="pe-last">Last posted (if reposted)</label>
        <div class="row" style="flex-wrap:nowrap;gap:6px"><input id="pe-last" type="date" value="${esc(p.lastPosted||'')}"><button type="button" class="btn sm" id="pe-last-today">Today</button></div>
        <div class="tiny" id="pe-last-wk"></div></div>
      <div class="field"><label class="f" for="pe-recycle">What to do with it next</label>
        <select id="pe-recycle">${Object.entries(RECYCLE).map(([k,v])=>`<option value="${k}" ${k===(p.recycle||'')?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="field" id="pe-stats-wrap"><label class="f">Stats <span class="tiny">${p.statsLoggedAt?`· last logged ${fmtDateTime(p.statsLoggedAt)}${p.statsBy?' by '+esc(p.statsBy):''}`:`· log them ${S.settings.statsDays} days after posting`}</span></label><div id="pe-stats"></div>
      <div class="tiny">Avg watch time as m:ss (e.g. 0:14) or seconds.</div></div>
    <div id="pe-err" class="err-msg"></div>
    ${isNew ? `<div class="thread tiny">Save first to start a discussion on this post.</div>` : threadHTML(p.id,'post')}
  </div>
  <div class="mf">
    ${isNew ? '' : `<button class="btn danger" id="pe-del">Delete</button>`}
    <div class="sp"></div>
    <button class="btn" data-close>Cancel</button>
    <button class="btn primary" id="pe-save">Save</button>
  </div>`;

  const m = openModal(html, { onClose: async saved => { if (!saved) for (const id of fresh) await deleteImage(id); } });

  const readStats = () => {
    $$('#pe-stats input', m).forEach(inp => {
      const [pl, mt] = inp.dataset.k.split('.');
      p.stats[pl] ??= {};
      const v = mt==='avgWatch' ? parseWatch(inp.value) : num(inp.value);
      p.stats[pl][mt] = v;
    });
  };
  const drawStats = () => {
    const showStats = manual || ['Posted','Scheduled'].includes($('#pe-status',m).value) || Object.keys(p.stats||{}).length;
    $('#pe-stats-wrap',m).style.display = showStats ? '' : 'none';
    $('#pe-recycle-wrap',m).style.display = (manual || $('#pe-status',m).value==='Posted') ? '' : 'none';
    $('#pe-stats',m).innerHTML = p.platforms.length ? p.platforms.map(pid => { const pl = plat(pid); const st = p.stats?.[pid]||{};
      return `<div class="stats-plat"><h5>${pl.name}</h5><div class="stats-grid">${pl.metrics.map(mt=>`<div><label>${metricLabel(pid,mt)}</label><input data-k="${pid}.${mt}" inputmode="${mt==='avgWatch'?'text':'numeric'}" value="${mt==='avgWatch'?fmtWatch(st[mt]):(st[mt]??'')}" placeholder="${mt==='avgWatch'?'0:00':'—'}"></div>`).join('')}</div></div>`; }).join('')
      : `<div class="tiny">Pick at least one platform.</div>`;
  };
  const imgField = (key, label) => {
    const el = $(key==='screenshotId' ? '#pe-shot' : '#pe-thumb', m); if (!el) return;
    const id = p[key];
    const needed = key==='thumbId' ? (manual && !p.thumbId && !p.screenshotId) : (!manual && !wasPosted && $('#pe-status',m).value==='Posted' && !id);
    el.innerHTML = `<div class="imgfield ${needed?'req':''}">
      <div class="prev">${id ? `<img data-img="${thumb(id)}" data-full="${id}" alt="">` : (needed?'Required':'No image')}</div>
      <div class="row" style="flex-direction:column;align-items:flex-start;gap:6px">
        <span class="btn sm upload-btn">${id?'Replace':'Upload'}<input type="file" accept="image/*"></span>
        ${id ? `<a class="btn sm ghost" data-dl="${id}">Download</a><button class="btn sm ghost" data-rm>Remove</button>` : ''}
      </div></div>`;

    $('#pe-treq',m).textContent = manual ? '· required' : '· shows in the Library';
    hydrate(el);
    $('input[type=file]',el).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      el.querySelector('.prev').textContent = 'Uploading…';
      try { const nid = await uploadImage(f); fresh.add(nid); if (p[key]) { fresh.has(p[key]) ? (await deleteImage(p[key]), fresh.delete(p[key])) : toDelete.add(p[key]); } p[key] = nid; }
      catch(err){ toast(err.message,'err'); }
      imgField(key,label); if (key==='screenshotId' || key==='thumbId') { imgField(key==='thumbId'?'screenshotId':'thumbId'); }
    };
    const rm = $('[data-rm]',el); if (rm) rm.onclick = async () => { if (fresh.has(p[key])) { await deleteImage(p[key]); fresh.delete(p[key]); } else toDelete.add(p[key]); p[key] = ''; imgField(key,label); };
    const dl = $('[data-dl]',el); if (dl) dl.onclick = async () => { const src = await getImg(dl.dataset.dl); if (src) download(`${(p.title||'image').replace(/[^\w-]+/g,'_')}.jpg`, src); };
    const im = $('.prev img',el); if (im) im.onclick = () => lightbox(im.dataset.full);
  };

  $('#pe-funnel',m).onchange = e => { p.funnelId = e.target.value; $('#pe-type',m).innerHTML = typeOptions(p.funnelId,''); };
  $('#pe-status',m).onchange = () => { readStats(); drawStats(); imgField('screenshotId'); };
  $('#pe-plats',m).onchange = e => { readStats(); const v = e.target.value; e.target.closest('label').classList.toggle('on', e.target.checked);
    p.platforms = e.target.checked ? [...new Set([...p.platforms, v])] : p.platforms.filter(x=>x!==v);
    p.platforms.sort((a,b)=>PLATFORMS.findIndex(x=>x.id===a)-PLATFORMS.findIndex(x=>x.id===b)); drawStats(); };
  drawStats(); imgField('screenshotId'); imgField('thumbId');
  const rpBox = $('#pe-isrepost',m);
  if (rpBox) {
    rpBox.onchange = () => { $('#pe-orig-wrap',m).hidden = !rpBox.checked; };
    $('#pe-orig',m).onchange = e => { const o = S.posts.find(x=>x.id===e.target.value); if (!o) return;
      if (!$('#pe-title',m).value.trim()) $('#pe-title',m).value = o.title;
      $('#pe-funnel',m).value = o.funnelId; p.funnelId = o.funnelId; $('#pe-type',m).innerHTML = typeOptions(o.funnelId, o.typeId);
      if (!$('#pe-link',m).value.trim() && o.link) {} };
  }
  const wkTxt = () => { const d = $('#pe-date',m).value, l = $('#pe-last',m).value; $('#pe-date-wk',m).textContent = d ? halfWeeks(d) : ''; $('#pe-last-wk',m).textContent = l ? halfWeeks(l) : 'Leave blank if it has only been posted once.'; };
  $('#pe-date',m).addEventListener('input', wkTxt); $('#pe-last',m).addEventListener('input', wkTxt);
  $('#pe-last-today',m).onclick = () => { $('#pe-last',m).value = todayISO(); wkTxt(); };
  wkTxt();

  const del = $('#pe-del',m);
  if (del) del.onclick = async () => {
    if (!await askConfirm(`Delete "${p.title||'this post'}"? This removes it from the calendar, library and review.`)) return;
    await store.remove('posts', p.id);
    for (const id of [p.screenshotId, p.thumbId, ...fresh, ...toDelete]) if (id) await deleteImage(id);
    for (const c of S.comments.filter(c=>c.parentId===p.id)) await store.remove('comments', c.id);
    const idea = S.ideas.find(i=>i.postId===p.id); if (idea) await store.update('ideas', idea.id, {status:'open', postId:''});
    closeModal(true); toast('Deleted');
  };

  $('#pe-save',m).onclick = async () => {
    readStats();
    p.title = $('#pe-title',m).value.trim(); p.date = $('#pe-date',m).value; if ($('#pe-time',m)) p.time = $('#pe-time',m).value; p.status = manual ? 'Posted' : $('#pe-status',m).value;
    p.funnelId = $('#pe-funnel',m).value; p.typeId = $('#pe-type',m).value; p.notes = $('#pe-notes',m).value.trim(); p.recycle = $('#pe-recycle',m).value;
    p.lastPosted = $('#pe-last',m).value; let lk = $('#pe-link',m).value.trim(); if (lk && !/^https?:\/\//i.test(lk)) lk = 'https://' + lk; p.link = lk;
    const err = t => { $('#pe-err',m).textContent = t; };
    const rpb = $('#pe-isrepost',m); p.repostOf = rpb && rpb.checked ? $('#pe-orig',m).value : '';
    if (rpb && rpb.checked && !p.repostOf) return err('Choose the original video, or untick "This is a repost".');
    if (!p.title) return err('Add a title.');
    if (!manual && !p.date) return err('Pick a posting date.');
    if (!p.platforms.length) return err('Pick at least one platform.');
    if (!manual && p.status==='Posted' && !p.screenshotId && !wasPosted) return err('Add a screenshot of the post before marking it Posted.');
    if (manual && !p.thumbId && !p.screenshotId) return err('Add a thumbnail for this video.');
    // keep only stats for selected platforms
    const stats = {}; p.platforms.forEach(pl => { if (p.stats?.[pl] && Object.values(p.stats[pl]).some(v=>v!=null)) stats[pl] = p.stats[pl]; });
    p.stats = stats;
    if (JSON.stringify(stats) !== origStats && Object.keys(stats).length) { p.statsLoggedAt = Date.now(); p.statsBy = S.me.name; }
    const {id, ...data} = p;

function reviewRows(){
  const r = S.rv;
  const rows = [];
  S.posts.filter(p => isPosted(p) && (r.funnel==='all'||p.funnelId===r.funnel) && (r.type==='all'||p.typeId===r.type)
    && (!r.from || (p.date && p.date>=r.from)) && (!r.to || (p.date && p.date<=r.to)))
    .forEach(p => (p.platforms||[]).forEach(pl => { if (r.platform!=='all' && pl!==r.platform) return;
      const st = p.stats?.[pl] || {}; const pm = plat(pl).metrics;
      const row = {p, pl}; REVIEW_COLS.forEach(k => row[k] = pm.includes(k) ? (st[k] ?? null) : undefined);
      const eng = ['comments','shares','saves'].reduce((a,k)=>a+(row[k]||0),0);
      row.eng = row.views ? eng/row.views*100 : null; rows.push(row); }));
  const k = r.sort, dir = r.dir;
  rows.sort((a,b)=>{
    if (k==='date') return dir*((a.p.date||'').localeCompare(b.p.date||''));
    if (k==='title') return dir*a.p.title.localeCompare(b.p.title);
    if (k==='platform') return dir*a.pl.localeCompare(b.pl);
    const av = a[k] ?? -Infinity, bv = b[k] ?? -Infinity; return dir*(av-bv);
  });
  return rows;
}

function sparkline(pts){
  if (pts.length < 2) return `<div class="spark-empty">Log at least twice to see the trend</div>`;
  const vs = pts.map(p=>p.v), lo = Math.min(...vs), hi = Math.max(...vs), rng = hi-lo || 1;
  const t0 = +parseISO(pts[0].d), t1 = +parseISO(pts[pts.length-1].d), tr = t1-t0 || 1;
  const xy = pts.map(p => [((+parseISO(p.d)-t0)/tr)*100, 30 - ((p.v-lo)/rng)*26]);
  const line = xy.map(([x,y])=>`${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
  const hits = pts.map((p,i)=>{ const x = xy[i][0], w = 100/Math.max(pts.length-1,1); return `<rect x="${Math.max(0,x-w/2).toFixed(2)}" y="0" width="${w.toFixed(2)}" height="34" fill="transparent"><title>${fmtDate(p.d)}: ${p.v.toLocaleString('en-IE')}</title></rect>`; }).join('');
  const [ex,ey] = xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" role="img" aria-label="Follower trend from ${pts[0].v.toLocaleString('en-IE')} to ${pts[pts.length-1].v.toLocaleString('en-IE')}">
    <polygon points="0,34 ${line} 100,34" fill="var(--mintSoft)"/>
    <polyline points="${line}" fill="none" stroke="var(--mint)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${ex}" y1="${ey}" x2="${ex}" y2="${ey}" stroke="var(--mint)" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${hits}</svg>`;
}
function deltaChip(d, label){
  if (d == null) return '';
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
  const sign = d > 0 ? '▲ +' : d < 0 ? '▼ −' : '';
  return `<span class="dl ${cls}">${sign}${Math.abs(d).toLocaleString('en-IE')}<span>${label}</span></span>`;
}

function viewWeekly(){

  const posted = posts.filter(isPosted);
  const wd = S.weekly.find(w=>w.id===S.wk) || {};
  const refl = S.reflections.filter(r=>{ const d = iso(new Date(r.createdAt)); return d>=S.wk && d<=end; }).sort((a,b)=>b.createdAt-a.createdAt);
  const perPlat = PLATFORMS.map(pl => { const ps = posted.filter(p=>p.platforms?.includes(pl.id)); if (!ps.length) return null;
    const tot = k => ps.reduce((a,p)=>a+(p.stats?.[pl.id]?.[k]||0),0); return {pl, n:ps.length, views:tot('views'), follows:tot('follows'), comments:tot('comments')}; }).filter(Boolean);
  const best = [...posted].sort((a,b)=>totalViews(b)-totalViews(a))[0];

  <div class="wk-grid">
    <div>
      ${sec('wk-1', q(1,"What's going out, and why"), `

          <div class="row" style="gap:4px">${platChips(p.platforms)}</div></div>`; }).join('') || `<div class="empty">Nothing planned for this week. <a href="#" data-act="nav" data-v="calendar">Go to the calendar</a></div>`}`)}
      ${sec('wk-2', q(2,'How it performed'), posted.length ? `
          ${missing?`<div class="tiny" style="margin-bottom:8px">⚠︎ ${missing} posted video${missing>1?'s are':' is'} missing stats.</div>`:''}
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Platform</th><th class="num">Posts</th><th class="num">Views</th><th class="num">Comments</th><th class="num">Follows/Subs</th></tr></thead>
          <tbody>${perPlat.map(x=>`<tr><td>${x.pl.name}</td><td class="num">${x.n}</td><td class="num">${fmtNum(x.views)}</td><td class="num">${x.pl.metrics.includes('comments')?fmtNum(x.comments):'·'}</td><td class="num">${fmtNum(x.follows)}</td></tr>`).join('')}</tbody></table></div>

async function saveSettings(mut){ const s = clean(S.settings); mut(s); S.settings = s; requestRender(); try { await store.setSettings(s); } catch(e){ toast('Could not save settings: '+e.message,'err'); } }
const moveIn = (arr, ix, d) => { const j = ix+d; if (j<0||j>=arr.length) return; [arr[ix],arr[j]] = [arr[j],arr[ix]]; };

function threadHTML(pid, ptype){ return `<div class="thread" data-thread="${pid}" data-ptype="${ptype}"></div>`; }
function renderThread(el){
  const pid = el.dataset.thread; const list = S.comments.filter(c=>c.parentId===pid).sort(byCreated);
  const ta = el.querySelector('textarea'); const val = ta?.value || ''; const foc = document.activeElement === ta;
  el.innerHTML = `<h4>Discussion</h4>${list.map(c=>`<div class="cmt"><span class="avatar">${esc(initials(c.author))}</span><div class="cb"><div class="ch"><b>${esc(c.author)}</b><span class="tiny">${fmtDateTime(c.createdAt)}</span><span style="flex:1"></span>${c.author===S.me.name?`<button class="icon-btn" data-act="cmtDel" data-id="${c.id}" title="Delete">✕</button>`:''}</div><div class="ct">${esc(c.text)}</div></div></div>`).join('') || `<div class="tiny" style="margin-bottom:8px">No comments yet.</div>`}
    <div class="comment-add"><textarea rows="1" placeholder="Add a comment for ${S.me.name==='Daniel'?'Milo':'the team'}…"></textarea><button class="btn sm primary" data-act="cmtAdd" data-pid="${pid}">Post</button></div>`;
  const nta = el.querySelector('textarea'); nta.value = val; if (foc) nta.focus();
}
function refreshThreads(){ $$('[data-thread]').forEach(renderThread); }

// ---------- modal system ----------
let modalState = null;
function openModal(html, {onClose, small}={}){
  closeModal(false, true);
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay"><div class="modal ${small?'sm':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = root.firstElementChild, m = ov.firstElementChild;
  modalState = {onClose};
  ov.addEventListener('mousedown', e => { if (e.target === ov) ov._down = true; });
  ov.addEventListener('click', e => { if (e.target === ov && ov._down) closeModal(false); ov._down = false; });
  $$('[data-close]', m).forEach(b => b.onclick = () => closeModal(false));
  document.body.style.overflow = 'hidden';
  refreshThreads(); hydrate(m);
  return m;
}
function closeModal(saved=false, silent=false){
  if (!modalState) return; const st = modalState; modalState = null;
  $('#modal-root').innerHTML = ''; document.body.style.overflow = '';
  if (st.onClose) st.onClose(saved);
  if (!silent) requestRender();
}
function askConfirm(msg, okLabel='Delete'){
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'overlay'; d.style.zIndex = 80; d.style.alignItems = 'center';
    d.innerHTML = `<div class="modal sm"><div class="mb">${esc(msg)}</div><div class="mf"><div class="sp"></div><button class="btn" data-no>Cancel</button><button class="btn primary" data-yes>${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(d);
    d.querySelector('[data-no]').onclick = () => { d.remove(); res(false); };

function dataURLtoBlob(u){ const [h,b] = u.split(','); const mime = (h.match(/:(.*?);/)||[])[1] || 'image/jpeg'; const bin = atob(b); const arr = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], {type:mime}); }
async function importVideos(file){
  let data; try { data = JSON.parse(await file.text()); } catch { toast("That file isn't a valid import file",'err'); return; }
  if (data && data.weeklyword) return importWordData(data.weeklyword);
  if (data && (data.ideas || data.youtube)) return importIdeaData(data);
  return importVideoData(data);
}
async function importWordData(arr){
  const norm = x => String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const have = new Set(S.weeklyword.map(w => norm(w.title)+'|'+(w.date||'')));
  const haveText = new Set(S.weeklyword.map(w => norm(w.text).slice(0,200)));
  let added = 0, skipped = 0; const now = Date.now();
  for (const [i, w] of arr.entries()) {
    if (!w || !w.text) continue;
    const k = norm(w.title)+'|'+(w.date||'');
    if (have.has(k) || haveText.has(norm(w.text).slice(0,200))) { skipped++; continue; }
    have.add(k);
    await store.add('weeklyword', {date: w.date||'', title: w.title||'', text: w.text, status: w.status||'not',
      carousels: (w.carousels||[]).map(c => ({id: uid(), title: c.title||'', hook: c.hook||'', angle: c.angle||'', review: c.review||'unfiltered', refineNote: c.refineNote||''})),
      createdBy: S.me.name, createdAt: now - i});
    added++;
  }
  toast(`Imported ${added} Weekly Words${skipped?` (${skipped} already there)`:''}`);
}
async function importIdeaData(data){
  const norm = x => String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const findF = v => S.settings.funnels.find(f => f.id===v || norm(f.name)===norm(v) || norm(f.name).split(' ')[0]===norm(v)) || S.settings.funnels[0];
  const ideas = data.ideas || [], yts = data.youtube || [];
  const missing = [];
  ideas.forEach(v => { const f = findF(v.funnel); if (v.type && !f.types.some(x => norm(x.name)===norm(v.type)) && !missing.some(m=>m.f===f.id && norm(m.n)===norm(v.type))) missing.push({f:f.id, n:v.type}); });
  if (missing.length) await saveSettings(st => missing.forEach(m => st.funnels.find(f=>f.id===m.f).types.push({id:'t_'+uid(), name:m.n})));
  const haveI = new Set(S.ideas.map(i=>norm(i.title))), haveY = new Set(S.youtube.map(y=>norm(y.title)));
  let ai = 0, ay = 0, skip = 0; const now = Date.now();
  toast(`Importing ${ideas.length + yts.length} ideas…`);
  for (const [ix,v] of ideas.entries()) {
    if (haveI.has(norm(v.title))) { skip++; continue; }
    const f = findF(v.funnel), ty = S.settings.funnels.find(x=>x.id===f.id).types.find(x => norm(x.name)===norm(v.type));
    await store.add('ideas', {title:v.title, description:v.description||'', funnelId:f.id, typeId:ty?.id||'', series:v.series||'', research:v.research||'', imageIds:[], status:'open', createdBy:S.me.name, createdAt: now - ix});
    haveI.add(norm(v.title)); ai++;
  }
  for (const [ix,v] of yts.entries()) {
    if (haveY.has(norm(v.title))) { skip++; continue; }
    await store.add('youtube', {title:v.title, angle:v.angle||'', format:v.format||'', stage:v.stage||'idea', outline:v.outline||'', shorts:v.shorts||'', imageIds:[], createdBy:S.me.name, createdAt: now - ix});
    haveY.add(norm(v.title)); ay++;
  }
  toast(`Added ${ai} ideas and ${ay} YouTube ideas${skip?` · skipped ${skip} already there`:''}`);
}
async function importVideoData(data){
  const vids = Array.isArray(data) ? data : (data.videos || []);
  if (!vids.length) { toast('No videos found in that file','err'); return; }
  const norm = x => String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const findF = v => S.settings.funnels.find(f => f.id===v || norm(f.name)===norm(v) || norm(f.name).startsWith(norm(v)+' ') || norm(f.name).split(' ')[0]===norm(v)) || null;
  const known = new Set(S.posts.map(p => p.link || (norm(p.title)+'|'+(p.date||''))));
  const missing = [];
  vids.forEach(v => { const f = findF(v.funnel) || S.settings.funnels[0]; if (v.type && !f.types.some(x => x.id===v.type || norm(x.name)===norm(v.type)) && !missing.some(m=>m.f===f.id && norm(m.n)===norm(v.type))) missing.push({f:f.id, n:v.type}); });
  if (missing.length) await saveSettings(st => missing.forEach(m => st.funnels.find(f=>f.id===m.f).types.push({id:'t_'+uid(), name:m.n})));
  let added = 0, skipped = 0;
  toast(`Importing ${vids.length} videos…`);
  for (const v of vids) {
    const key = v.link || (norm(v.title)+'|'+(v.date||''));
    if (known.has(key)) { skipped++; continue; }
    if ((added+1) % 20 === 0) toast(`Imported ${added+1} of ${vids.length}…`);
    const f = findF(v.funnel) || S.settings.funnels[0];
    const ty = f.types.find(x => x.id===v.type || norm(x.name)===norm(v.type));
    let thumbId = '';
    if (v.thumbnail) { try { thumbId = await uploadImage(String(v.thumbnail).startsWith('data:') ? dataURLtoBlob(v.thumbnail) : await (await fetch(v.thumbnail)).blob()); } catch(e){ console.warn('thumb failed', e); } }
    const plats = (v.platforms||['ig']).map(x=>String(x).toLowerCase()).map(x => ({instagram:'ig',facebook:'fb',tiktok:'tt',youtube:'ytl','youtube shorts':'yts',shorts:'yts'}[x] || x)).filter(x=>plat(x));
    await store.add('posts', { title: v.title || 'Untitled video', date: v.date || '', lastPosted: v.lastPosted || '', link: v.link || '', funnelId: f.id, typeId: ty?.id || '',
      status: STATUSES.includes(v.status) ? v.status : 'Posted', source: v.status && v.status!=='Posted' || v.schedule ? 'calendar' : 'manual', time: v.time || '',
      platforms: plats.length?plats:['ig'], notes: v.notes || '', screenshotId:'', thumbId, stats: v.stats || {}, recycle: v.recycle || '',
      createdBy: S.me.name, createdAt: Date.now() });
    known.add(key); added++;
  }
  toast(`Imported ${added} post${added===1?'':'s'}${skipped?` · skipped ${skipped} already in the hub`:''}`);
}
function exportPosts(){
  const head = ['Date','Last posted','Title','Link','Funnel','Type','Status','Platform','Views','Comments','Shares','Saves','Follows/Subs','Avg watch (s)','Times reposted','Next step','Notes'];

// ---------- events: change / input ----------
document.addEventListener('change', async e => {
  const t = e.target, k = t.dataset.chg; if (!k) return;
  const fid = t.dataset.fid, tid = t.dataset.tid;
  switch (k) {
    case 'demoUser': S.me = {name:t.value, email:''}; try{ localStorage.setItem('verus_demo_user', t.value); }catch{} renderShell(); renderView(); refreshThreads(); break;
    case 'idfSeries': S.idf.series = t.value; renderView(); break;
    case 'idfSched': S.idf.showScheduled = t.checked; renderView(); break;
    case 'lfFunnel': S.lf.funnel = t.value; renderView(); break;
    case 'lfRecycle': S.lf.recycle = t.value; renderView(); break;
    case 'lfSort': S.lf.sort = t.value; renderView(); break;
    case 'lfReady': S.lf.ready = t.checked; renderView(); break;
    case 'rvPlatform': S.rv.platform = t.value; renderView(); break;
    case 'rvFunnel': S.rv.funnel = t.value; S.rv.type = 'all'; renderView(); break;
    case 'rvType': S.rv.type = t.value; renderView(); break;
    case 'rvBest': S.rv.best = t.value; renderView(); break;
    case 'rvFrom': S.rv.from = t.value; renderView(); break;
    case 'rvTo': S.rv.to = t.value; renderView(); break;
    case 'rvRange': { const v = t.value; if (v==='all') { S.rv.from=''; S.rv.to=''; } else if (v) { S.rv.from = iso(addDays(new Date(), -(+v))); S.rv.to = todayISO(); } renderView(); break; }
    case 'rfAuthor': S.rf.author = t.value; renderView(); break;
    case 'chkToggle': await saveSettings(s => { const c = s.checklist.find(c=>c.id===t.dataset.id); c.done = t.checked; c.checkedAt = t.checked?Date.now():null; c.checkedBy = t.checked?S.me.name:''; }); break;
    case 'fColor': await saveSettings(s => s.funnels.find(f=>f.id===fid).color = t.value); break;
    case 'fName': { const v = t.value.trim(); if (!v) { renderView(); return; } await saveSettings(s => s.funnels.find(f=>f.id===fid).name = v); break; }
    case 'tName': { const v = t.value.trim(); if (!v) { renderView(); return; } await saveSettings(s => s.funnels.find(f=>f.id===fid).types.find(x=>x.id===tid).name = v); break; }
    case 'mName': await saveSettings(s => s.members[+t.dataset.ix].name = t.value.trim()); if (store.mode==='firebase') resolveMe(); break;
    case 'mEmail': await saveSettings(s => s.members[+t.dataset.ix].email = t.value.trim().toLowerCase()); if (store.mode==='firebase') resolveMe(); break;
    case 'wwStatus': await store.update('weeklyword', t.dataset.id, {status: t.value}); toast(wwLabel(t.value)); break;
    case 'followAcct': await saveSettings(st => { st.followerAccounts = {...FOLLOW_DEFAULTS, ...(st.followerAccounts||{}), [t.dataset.k]: t.value.trim() || FOLLOW_DEFAULTS[t.dataset.k]}; }); break;
    case 'repostWeeks': await saveSettings(s => s.repostWeeks = Math.max(1, +t.value || 12)); break;
    case 'importVideos': { const f = t.files[0]; t.value = ''; if (f) importVideos(f); break; }
    case 'statsDays': await saveSettings(s => s.statsDays = Math.max(1, +t.value || 7)); break;
  }
});
let inpTimer;
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.inp; if (!k) return;
  clearTimeout(inpTimer);
  inpTimer = setTimeout(() => {
    if (k==='wwQ') S.wwq = t.value; if (k==='ytQ') S.ytq = t.value;
    if (k==='idfQ') S.idf.q = t.value; if (k==='lfQ') S.lf.q = t.value; if (k==='rfQ') S.rf.q = t.value;
    const pos = t.selectionStart; renderView(); const n = $(`[data-inp="${k}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch {} }
  }, 220);
});
// weekly notes autosave
document.addEventListener('focusout', async e => {
  const t = e.target; const f = t.dataset?.wkField; if (!f) return;
  const wd = S.weekly.find(w=>w.id===S.wk) || {};
  if ((wd[f]||'') === t.value) return;
  const {id:_wid, ...rest} = wd; await store.set('weekly', S.wk, {...rest, [f]: t.value, updatedAt: Date.now(), updatedBy: S.me.name});
  toast('Saved');
});
document.addEventListener('keydown', e => { if (e.key==='Escape') { const lb = $('.lightbox'); if (lb) { lb.remove(); return; } if (modalState && !document.querySelector('body > .overlay')) closeModal(false); } });

// ---------- seeding ----------
let seeding = false;
async function seedEverything(){
  if (seeding) return; seeding = true;
  const s = defaultSettings(); await store.setSettings(s); S.settings = s;
  if (!S.me) { resolveMe(); if (!S.me) S.me = {name: s.members[0].name, email:''}; }
  const now = Date.now();
  for (const [ix, [funnelId,typeId,title,description,series='',research='']] of SEED_IDEAS.entries())
    await store.add('ideas', {title, description, funnelId, typeId, series, research, imageIds:[], status:'open', createdBy:'Starter idea', createdAt: now - ix*1000});
  for (const [ix, [horizon,text]] of SEED_PLANS.entries()) await store.add('plans', {horizon, text, done:false, createdBy:'Milo', createdAt: now + ix});
  let lib = window.PRELOAD_VIDEOS || null;
  if (!lib) { try { const r = await fetch('library-seed.json', {cache:'no-store'}); if (r.ok) lib = await r.json(); } catch {} }
  if (lib) await importVideoData(lib);
  seeding = false;
}

// ---------- boot ----------
let AUTH = null;
function resolveMe(){
  if (store.mode !== 'firebase' || !AUTH.user) return;
  const email = (AUTH.user.email||'').toLowerCase();
  const m = S.settings?.members.find(x => x.email && x.email.toLowerCase() === email);
  S.me = {name: m?.name || AUTH.user.displayName || email.split('@')[0], email};
}
function startSync(){
  store.subscribe('settings', async (data, meta) => {
    if (!data) { if (!meta?.fromCache) await seedEverything(); return; }
    S.settings = data; S.loaded.add('settings'); resolveMe();
    if (!S.me) { let n = null; try { n = localStorage.getItem('verus_demo_user'); } catch {} S.me = {name: data.members.find(x=>x.name===n)?.name || data.members[0]?.name || 'Milo', email:''}; }
    requestRender();
  });
  COLLS.forEach(c => store.subscribe(c, list => { S[c] = list; S.loaded.add(c); if (S.settings) requestRender(); }));
}
function showDenied(){
  $('#app').innerHTML = `<div class="card login"><h1>VERUS</h1><p>This account (${esc(AUTH?.user?.email||'')}) isn't on the team list in the Firestore security rules.</p><p class="tiny">Ask Milo to add your email to <code>firestore.rules</code> and publish them again.</p><button class="btn" id="so">Sign out</button></div>`;
  $('#so').onclick = async () => { await AUTH.signOut(); location.reload(); };
}
async function bootFirebase(cfg){
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [appM, authM, fs] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = appM.initializeApp(cfg);
  let db; try { db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); } catch { db = fs.getFirestore(app); }
  const auth = authM.getAuth(app);
  AUTH = { user:null, signOut: () => authM.signOut(auth) };
  store = new FirebaseStore({fs, db});
  let started = false;
  authM.onAuthStateChanged(auth, user => {
    AUTH.user = user;
    if (!user) { started = false; renderLogin(auth, authM); return; }
    if (!started) { started = true; $('#app').innerHTML = `<div class="loading">Syncing…</div>`; resolveMe(); startSync(); }
  });
}
function renderLogin(auth, authM){
  $('#app').innerHTML = `<div class="card login">
    <h1>VERUS</h1><p class="muted" style="margin-top:2px">Content Hub · sign in to continue</p>
    <button class="btn primary" id="g" style="width:100%;justify-content:center;margin:14px 0">Sign in with Google</button>
    <div class="tiny" style="text-align:center;margin-bottom:10px">or with email</div>
    <div class="field"><input id="em" type="email" placeholder="Email" autocomplete="username"></div>
    <div class="field"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"></div>
    <button class="btn" id="ep" style="width:100%;justify-content:center">Sign in</button>
    <div id="lerr" class="err-msg"></div></div>`;
  const err = e => { console.error(e); $('#lerr').textContent = (e.code||'').replace('auth/','').replace(/-/g,' ') || e.message; };
  $('#g').onclick = async () => { const prov = new authM.GoogleAuthProvider(); try { await authM.signInWithPopup(auth, prov); } catch(e) {
    if (['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)) authM.signInWithRedirect(auth, prov).catch(err); else err(e); } };
  $('#ep').onclick = () => authM.signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value).catch(err);
  $('#pw').onkeydown = e => { if (e.key==='Enter') $('#ep').click(); };
}
(async function boot(){
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.apiKey) {
    try { await bootFirebase(cfg); }
    catch(e){ console.error(e); $('#app').innerHTML = `<div class="card login"><h1>VERUS</h1><p>Couldn't connect to Firebase.</p><p class="tiny">${esc(e.message)}</p><p class="tiny">Check firebase-config.js and your internet connection.</p></div>`; }
  } else { store = new LocalStore(); startSync(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
